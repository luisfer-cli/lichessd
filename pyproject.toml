[project]
name = "lichessd"
version = "0.1.0"
description = "Unix daemon for Lichess API integration — correspondence games, puzzles, and more"
authors = [
    { name = "Luis Fernando Rodriguez", email = "luis.rodriguez21@ucr.ac.cr" }
]
requires-python = ">=3.11"
dependencies = [
    "chess>=1.10",
    "httpx>=0.28.1",
]

[project.scripts]
lichessd = "lichessd.__main__:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pyinstaller>=6.22.0",
    "ruff>=0.16.2",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "TCH", "RUF"]

[tool.mypy]
strict = true
python_version = "3.14"
